#配置文件Cargo.toml
[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# google指定libc版本
libc = "=0.2.139"

[source.crates-io]
registry = "https://github.com/rust-lang/crates.io-index"
replace-with = 'ustc'
[source.ustc]
registry = "git://mirrors.ustc.edu.cn/crates.io-index"

[target.aarch64-unknown-linux-gnu]
# 目标平台的 GCC 链接器路径
# linker = "aarch64-linux-gnu-gcc"
# 静态库工具
# ar = "aarch64-linux-gnu-ar"

# 目标平台的 GCC 链接器路径
linker = "/home/dev/.conan2/p/linarf47e893cbce7e/p/bin/aarch64-linux-gnu-gcc"
# 静态库工具
ar = "/home/dev/.conan2/p/linarf47e893cbce7e/p/bin/aarch64-linux-gnu-ar"
# 可选：用于本地模拟执行
runner = "qemu-aarch64"

# 添加链接器参数
rustflags = [
    "-C", "link-args=--sysroot=/home/dev/.conan2/p/linarf47e893cbce7e/p/aarch64-linux-gnu/sysroot",
    "-C", "link-args=-Wl,-rpath-link=/home/dev/.conan2/p/linarf47e893cbce7e/p/aarch64-linux-gnu/lib"
]
